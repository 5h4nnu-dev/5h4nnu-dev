<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Skill levels shown as an nmap scan: recon 100, networking 100, linux 100, AI 100, python 83, typescript 78, cloud 55, reverse engineering 44, malware analysis 33" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
    .bone { fill: #e9e4d4; } .dim { fill: #6f8199; } .amber { fill: #ffb000; }
    .track { fill: #162234; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="900" height="400" rx="10" fill="#0a0f17" stroke="#1e3350"/>
  <text x="28" y="34" class="dim">$ nmap -sV --skills shannu.local</text>
  <text x="28" y="58" class="dim">PORT      STATE   SERVICE                 CONFIDENCE</text>
  <line x1="28" y1="68" x2="872" y2="68" stroke="#1e3350"/>

  <!-- rows: y step 34. Bars start x=520, max width 340 -->
  <g>
    <text x="28" y="98" class="bone">1/tcp     open    recon</text>
    <rect x="520" y="86" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="86" width="0" height="12" rx="2" fill="#3fd0c9"><animate attributeName="width" to="340" dur="1s" begin="0.2s" fill="freeze"/></rect>
    <text x="868" y="98" text-anchor="end" class="bone" opacity="0">100<animate attributeName="opacity" to="1" dur="0.2s" begin="1.2s" fill="freeze"/></text>

    <text x="28" y="132" class="bone">2/tcp     open    networking</text>
    <rect x="520" y="120" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="120" width="0" height="12" rx="2" fill="#3fd0c9"><animate attributeName="width" to="340" dur="1s" begin="0.35s" fill="freeze"/></rect>
    <text x="868" y="132" text-anchor="end" class="bone" opacity="0">100<animate attributeName="opacity" to="1" dur="0.2s" begin="1.35s" fill="freeze"/></text>

    <text x="28" y="166" class="bone">3/tcp     open    linux (arch, btw)</text>
    <rect x="520" y="154" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="154" width="0" height="12" rx="2" fill="#3fd0c9"><animate attributeName="width" to="340" dur="1s" begin="0.5s" fill="freeze"/></rect>
    <text x="868" y="166" text-anchor="end" class="bone" opacity="0">100<animate attributeName="opacity" to="1" dur="0.2s" begin="1.5s" fill="freeze"/></text>

    <text x="28" y="200" class="bone">4/tcp     open    ai-systems</text>
    <rect x="520" y="188" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="188" width="0" height="12" rx="2" fill="#3fd0c9"><animate attributeName="width" to="340" dur="1s" begin="0.65s" fill="freeze"/></rect>
    <text x="868" y="200" text-anchor="end" class="bone" opacity="0">100<animate attributeName="opacity" to="1" dur="0.2s" begin="1.65s" fill="freeze"/></text>

    <text x="28" y="234" class="bone">5/tcp     open    python</text>
    <rect x="520" y="222" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="222" width="0" height="12" rx="2" fill="#ffb000"><animate attributeName="width" to="282" dur="1s" begin="0.8s" fill="freeze"/></rect>
    <text x="868" y="234" text-anchor="end" class="bone" opacity="0">83<animate attributeName="opacity" to="1" dur="0.2s" begin="1.8s" fill="freeze"/></text>

    <text x="28" y="268" class="bone">6/tcp     open    typescript</text>
    <rect x="520" y="256" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="256" width="0" height="12" rx="2" fill="#ffb000"><animate attributeName="width" to="265" dur="1s" begin="0.95s" fill="freeze"/></rect>
    <text x="868" y="268" text-anchor="end" class="bone" opacity="0">78<animate attributeName="opacity" to="1" dur="0.2s" begin="1.95s" fill="freeze"/></text>

    <text x="28" y="302" class="bone">7/tcp     open    cloud</text>
    <rect x="520" y="290" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="290" width="0" height="12" rx="2" fill="#ff8a3d"><animate attributeName="width" to="187" dur="1s" begin="1.1s" fill="freeze"/></rect>
    <text x="868" y="302" text-anchor="end" class="bone" opacity="0">55<animate attributeName="opacity" to="1" dur="0.2s" begin="2.1s" fill="freeze"/></text>

    <text x="28" y="336" class="bone">8/tcp     filtered reverse-engineering</text>
    <rect x="520" y="324" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="324" width="0" height="12" rx="2" fill="#ff8a3d"><animate attributeName="width" to="150" dur="1s" begin="1.25s" fill="freeze"/></rect>
    <text x="868" y="336" text-anchor="end" class="bone" opacity="0">44<animate attributeName="opacity" to="1" dur="0.2s" begin="2.25s" fill="freeze"/></text>

    <text x="28" y="370" class="bone">9/tcp     filtered malware-analysis</text>
    <rect x="520" y="358" width="340" height="12" rx="2" class="track"/>
    <rect x="520" y="358" width="0" height="12" rx="2" fill="#ff5a4e"><animate attributeName="width" to="112" dur="1s" begin="1.4s" fill="freeze"/></rect>
    <text x="868" y="370" text-anchor="end" class="bone" opacity="0">33<animate attributeName="opacity" to="1" dur="0.2s" begin="2.4s" fill="freeze"/></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
