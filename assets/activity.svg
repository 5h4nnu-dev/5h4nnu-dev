<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="CTF-Archive activity: 43 commits (24 in July, 5 in August, 14 in November), 40 walkthroughs, 476 screenshots, about 11,300 lines of Markdown. Difficulty: 32 easy, 5 medium, 1 hard, 1 very easy, 1 learning." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .bone { fill: #e9e4d4; } .dim { fill: #6f8199; }
    .big { font-size: 30px; font-weight: 800; fill: #e9e4d4; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="900" height="290" rx="10" fill="#0a0f17" stroke="#1e3350"/>

  <!-- commit history by month -->
  <text x="28" y="34" class="bone">git log --since=jul --oneline | wc -l</text>
  <text x="28" y="54" class="dim">commits per month, CTF-Archive, 2026</text>
  <line x1="40" y1="232" x2="540" y2="232" stroke="#27405f"/>

  <rect x="80" y="232" width="64" height="0" rx="2" fill="#3fd0c9">
    <animate attributeName="height" to="132" dur="0.9s" begin="0.2s" fill="freeze"/>
    <animate attributeName="y" to="100" dur="0.9s" begin="0.2s" fill="freeze"/>
  </rect>
  <rect x="180" y="232" width="64" height="0" rx="2" fill="#3fd0c9">
    <animate attributeName="height" to="28" dur="0.9s" begin="0.35s" fill="freeze"/>
    <animate attributeName="y" to="204" dur="0.9s" begin="0.35s" fill="freeze"/>
  </rect>
  <rect x="280" y="230" width="64" height="2" fill="#27405f"/>
  <rect x="380" y="230" width="64" height="2" fill="#27405f"/>
  <rect x="480" y="232" width="64" height="0" rx="2" fill="#ffb000">
    <animate attributeName="height" to="77" dur="0.9s" begin="0.8s" fill="freeze"/>
    <animate attributeName="y" to="155" dur="0.9s" begin="0.8s" fill="freeze"/>
  </rect>

  <g text-anchor="middle">
    <text x="112" y="92" class="bone">24</text>
    <text x="212" y="196" class="bone">5</text>
    <text x="312" y="222" class="dim">0</text>
    <text x="412" y="222" class="dim">0</text>
    <text x="512" y="147" class="bone">14</text>
    <text x="112" y="254" class="dim">jul</text>
    <text x="212" y="254" class="dim">aug</text>
    <text x="312" y="254" class="dim">sep</text>
    <text x="412" y="254" class="dim">oct</text>
    <text x="512" y="254" class="dim">nov</text>
  </g>

  <!-- counters -->
  <g>
    <text x="600" y="64" class="big">40</text>
    <text x="660" y="62" class="dim">walkthroughs</text>
    <text x="600" y="104" class="big">476</text>
    <text x="680" y="102" class="dim">screenshots</text>
    <text x="600" y="144" class="big">43</text>
    <text x="660" y="142" class="dim">commits</text>
    <text x="600" y="184" class="big">11.3k</text>
    <text x="700" y="182" class="dim">lines of markdown</text>
  </g>

  <!-- difficulty split -->
  <text x="600" y="220" class="dim">difficulty split</text>
  <g>
    <rect x="600" y="230" width="0" height="14" fill="#3fd0c9"><animate attributeName="width" to="216" dur="0.8s" begin="1s" fill="freeze"/></rect>
    <rect x="816" y="230" width="0" height="14" fill="#ffb000"><animate attributeName="width" to="33.75" dur="0.2s" begin="1.8s" fill="freeze"/></rect>
    <rect x="849.75" y="230" width="0" height="14" fill="#ff5a4e"><animate attributeName="width" to="6.75" dur="0.1s" begin="2s" fill="freeze"/></rect>
    <rect x="856.5" y="230" width="0" height="14" fill="#e9e4d4"><animate attributeName="width" to="13.5" dur="0.1s" begin="2.1s" fill="freeze"/></rect>
  </g>
  <text x="600" y="266" class="dim">32 easy, 5 medium, 1 hard, 2 other</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
