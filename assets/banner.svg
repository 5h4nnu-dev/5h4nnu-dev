<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Shannu: security engineer. A packet travels the attack chain from recon to loot." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#101a28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#18243a" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#3fd0c9" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#3fd0c9" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="1030" cy="105" r="78"/></clipPath>
    <style>
      text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace; }
      .dim  { fill: #6f8199; }
      .bone { fill: #e9e4d4; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- slow scanline -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;320" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal prompt (types in, cursor blinks) -->
  <g font-size="15">
    <text x="60" y="52" class="dim">shannu@arch</text>
    <text x="165" y="52" fill="#ffb000">~</text>
    <text x="180" y="52" class="bone">$ ./trace --target everything</text>
    <rect x="455" y="39" width="9" height="16" fill="#ffb000">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- name: three layers, the offset layers jitter in short bursts -->
  <g font-size="112" font-weight="800" letter-spacing="2">
    <text x="56" y="165" fill="#3fd0c9" opacity="0.75">SHANNU
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-6 1;4 -1;0 0;0 0" keyTimes="0;0.88;0.9;0.93;0.95;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="165" fill="#ff5a4e" opacity="0.75">SHANNU
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;5 -1;-4 1;0 0;0 0" keyTimes="0;0.88;0.9;0.93;0.95;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="165" fill="#e9e4d4">SHANNU</text>
  </g>

  <!-- tagline -->
  <text x="62" y="205" font-size="19" class="bone">Security engineer. I build AI that finds, explains and fixes vulnerabilities.</text>
  <text x="62" y="230" font-size="14" class="dim">40 rooms written up, Arch Linux, based in India</text>

  <!-- radar -->
  <g>
    <circle cx="1030" cy="105" r="78" fill="#0d1623" stroke="#27405f"/>
    <circle cx="1030" cy="105" r="52" fill="none" stroke="#1e3350"/>
    <circle cx="1030" cy="105" r="26" fill="none" stroke="#1e3350"/>
    <path d="M952 105H1108M1030 27V183" stroke="#1e3350"/>
    <g clip-path="url(#radarClip)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 1030 105" to="360 1030 105" dur="4s" repeatCount="indefinite"/>
        <path d="M1030 105 L1108 105 A78 78 0 0 0 1086 50 Z" fill="url(#sweep)"/>
        <line x1="1030" y1="105" x2="1108" y2="105" stroke="#3fd0c9" stroke-width="2"/>
      </g>
    </g>
    <!-- blips: each lights up as the sweep passes -->
    <circle cx="1070" cy="78" r="4" fill="#ff5a4e">
      <animate attributeName="opacity" values="1;0.1;0.1;1" keyTimes="0;0.35;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="995" cy="140" r="4" fill="#ffb000">
      <animate attributeName="opacity" values="0.1;0.1;1;0.1" keyTimes="0;0.35;0.55;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1048" cy="150" r="3" fill="#3fd0c9">
      <animate attributeName="opacity" values="0.1;0.1;1;0.1" keyTimes="0;0.15;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="1030" y="203" font-size="12" text-anchor="middle" class="dim">3 hosts up</text>
  </g>

  <!-- attack chain -->
  <g>
    <line x1="150" y1="275" x2="1050" y2="275" stroke="#27405f" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- nodes: each swells when the packet reaches it (6s loop, 5 gaps) -->
    <circle cx="150" cy="275" r="6" fill="#0a0f17" stroke="#3fd0c9" stroke-width="2">
      <animate attributeName="r" values="12;6;6" keyTimes="0;0.1;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="275" r="6" fill="#0a0f17" stroke="#3fd0c9" stroke-width="2">
      <animate attributeName="r" values="6;6;12;6;6" keyTimes="0;0.16;0.2;0.3;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="275" r="6" fill="#0a0f17" stroke="#ff5a4e" stroke-width="2">
      <animate attributeName="r" values="6;6;12;6;6" keyTimes="0;0.36;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="275" r="6" fill="#0a0f17" stroke="#ffb000" stroke-width="2">
      <animate attributeName="r" values="6;6;12;6;6" keyTimes="0;0.56;0.6;0.7;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="275" r="6" fill="#0a0f17" stroke="#ffb000" stroke-width="2">
      <animate attributeName="r" values="6;6;12;6;6" keyTimes="0;0.76;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="275" r="6" fill="#0a0f17" stroke="#e9e4d4" stroke-width="2">
      <animate attributeName="r" values="6;6;12" keyTimes="0;0.96;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g font-size="13" text-anchor="middle" class="dim">
      <text x="150" y="304">recon</text>
      <text x="330" y="304">enumerate</text>
      <text x="510" y="304">exploit</text>
      <text x="690" y="304">foothold</text>
      <text x="870" y="304">escalate</text>
      <text x="1050" y="304">loot</text>
    </g>

    <!-- the packet -->
    <g>
      <circle r="5" fill="#ffb000"/>
      <circle r="11" fill="none" stroke="#ffb000" stroke-opacity="0.5">
        <animate attributeName="r" values="6;14;6" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="6s" repeatCount="indefinite" path="M150 275 L1050 275"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
